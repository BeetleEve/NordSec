{% load static %}<a class="item-card" href="{{ item.get_absolute_url }}" aria-labelledby="item-title-{{ item.pk }}">
  <div class="item-image illustration-{{ item.category.illustration }}">
    {% if item.photo %}<img src="{% url 'item_photo' item.pk %}" alt="{{ item.title }}" loading="lazy">{% else %}<img src="{% static 'illustrations/' %}{{ item.category.illustration }}.svg" alt="" loading="lazy">{% endif %}
    <span class="badge badge-{{ item.status }}">{{ item.get_status_display }}</span>
    <span class="free-label">Бесплатно</span>
  </div>
  <div class="item-card-body"><span class="item-category">{{ item.category.name }}</span><h3 id="item-title-{{ item.pk }}">{{ item.title }}</h3><p class="item-meta">{{ item.get_condition_display }}{% if item.size %} · {{ item.size }}{% endif %}</p><div class="item-card-bottom"><span><i class="location-dot"></i>{{ item.get_district_display }}</span><span class="item-card-arrow" aria-hidden="true">↗</span></div></div>
</a>
