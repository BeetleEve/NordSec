{% if history %}<section class="panel"><h2>История действий</h2><ol class="timeline">{% for event in history %}<li><span class="timeline-dot"></span><div><strong>{{ event.action }}</strong><time datetime="{{ event.created_at|date:'c' }}">{{ event.created_at|date:'d.m.Y, H:i' }}</time>{% if event.note %}<p>{{ event.note }}</p>{% endif %}</div></li>{% endfor %}</ol></section>{% endif %}
